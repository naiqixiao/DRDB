<figure class="figure fig-desk" id="fig-nested">
  <div class="fig-eyebrow">Fig. 1 · The layers</div>
  <div class="figure-scroll">
    <svg viewBox="0 0 1040 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three nested layers: society, the DRDB operations layer, and the experiment.">
      <defs>
        <pattern id="dots-a" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" class="f-ink" opacity="0.07"/>
        </pattern>
      </defs>
      <rect x="0" y="0" width="1040" height="380" fill="url(#dots-a)"/>

      <!-- outer ring: society -->
      <rect x="40" y="32" width="960" height="316" rx="8" class="f-ink s-ink" fill-opacity="0.015" stroke-opacity="0.30" stroke-width="1"/>
      <text x="64" y="60" class="t-eyebrow f-muted" font-size="8" letter-spacing="1.12">SOCIETY</text>
      <text x="64" y="84" class="t-sub f-soft" font-size="9">pandemics · new technology · privacy law · how families communicate</text>

      <!-- middle ring: the operations layer (focal) -->
      <rect x="88" y="104" width="864" height="212" rx="8" class="f-accent s-accent" fill-opacity="0.08" stroke-width="1.2"/>
      <text x="112" y="132" class="t-eyebrow f-accent" font-size="8" letter-spacing="1.12">LAB OPERATIONS LAYER · DRDB</text>
      <text x="112" y="156" class="t-sub f-accent" font-size="9" fill-opacity="0.85">the participant pool · eligibility · contacts · schedules · rooms · the people</text>

      <!-- inner ring: the experiment -->
      <rect x="136" y="176" width="768" height="116" rx="8" class="f-ink s-ink" fill-opacity="0.03" stroke-opacity="0.45" stroke-width="1"/>
      <text x="160" y="204" class="t-eyebrow f-muted" font-size="8" letter-spacing="1.12">THE EXPERIMENT</text>
      <text x="160" y="228" class="t-sub f-soft" font-size="9">the task · the data · the analysis</text>
      <text x="520" y="264" class="t-title f-ink" font-size="14" font-style="italic" text-anchor="middle">the same procedure, the same year after year</text>
    </svg>
  </div>
  <figcaption><span class="cap-key">Fig. 1</span>The operations layer absorbs outside change so the experiment stays the same.</figcaption>
</figure>
