<figure class="figure fig-phone" id="fig-nested-phone">
  <div class="fig-eyebrow">Fig. 1 · The layers</div>
  <div class="figure-scroll">
    <svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three stacked layers: society changes, the DRDB operations layer absorbs it, the experiment stays the same.">
      <defs>
        <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0 L8 4 L0 8 Z" class="f-muted"/>
        </marker>
        <pattern id="dots-p" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="1" class="f-ink" opacity="0.07"/>
        </pattern>
      </defs>
      <rect x="0" y="0" width="400" height="440" fill="url(#dots-p)"/>

      <!-- society -->
      <rect x="16" y="16" width="368" height="124" rx="8" class="f-ink s-ink" fill-opacity="0.015" stroke-opacity="0.30" stroke-width="1"/>
      <text x="36" y="48" class="t-eyebrow f-muted" font-size="8" letter-spacing="1.12">SOCIETY</text>
      <text x="36" y="80" class="t-sub f-soft" font-size="11">pandemics · new technology</text>
      <text x="36" y="102" class="t-sub f-soft" font-size="11">privacy law · how families communicate</text>

      <path d="M200 148 V176" fill="none" class="s-muted" stroke-width="1" marker-end="url(#arr-p)"/>
      <text x="220" y="168" class="t-arrow f-muted" font-size="8" letter-spacing="1.12">CHANGES</text>

      <!-- the operations layer (focal) -->
      <rect x="32" y="188" width="336" height="124" rx="8" class="f-accent s-accent" fill-opacity="0.08" stroke-width="1.2"/>
      <text x="52" y="220" class="t-eyebrow f-accent" font-size="8" letter-spacing="1.12">LAB OPERATIONS LAYER · DRDB</text>
      <text x="52" y="252" class="t-sub f-accent" font-size="11" fill-opacity="0.85">the participant pool · eligibility</text>
      <text x="52" y="274" class="t-sub f-accent" font-size="11" fill-opacity="0.85">contacts · schedules · rooms · people</text>

      <path d="M200 320 V348" fill="none" class="s-muted" stroke-width="1" marker-end="url(#arr-p)"/>
      <text x="220" y="340" class="t-arrow f-muted" font-size="8" letter-spacing="1.12">ABSORBS</text>

      <!-- the experiment -->
      <rect x="48" y="356" width="304" height="68" rx="8" class="f-ink s-ink" fill-opacity="0.03" stroke-opacity="0.45" stroke-width="1"/>
      <text x="68" y="384" class="t-eyebrow f-muted" font-size="8" letter-spacing="1.12">THE EXPERIMENT</text>
      <text x="200" y="412" class="t-title f-ink" font-size="13" font-style="italic" text-anchor="middle">the same procedure, year after year</text>
    </svg>
  </div>
  <figcaption><span class="cap-key">Fig. 1</span>The operations layer absorbs outside change so the experiment stays the same.</figcaption>
</figure>
